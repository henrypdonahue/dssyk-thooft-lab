# Fast test suites of all three modules + the thooft physics gate.
# Slow ED sweeps (-m slow) are excluded; run `make test-all` locally for those.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [thooft-target, syk-self-averaging, duality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.0.2" "scipy==1.13.1" "mpmath==1.3.0" \
                      "matplotlib==3.9.4" "pytest==6.2.5"
      - name: Run test suite
        working-directory: ${{ matrix.module }}
        run: python -m pytest -q -m 'not slow'

  physics-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.0.2" "scipy==1.13.1" "mpmath==1.3.0"
      - name: FLZ tables / sum rules / cross-check gate
        working-directory: thooft-target
        run: python validate.py
