# Fast test suites of all three modules + the thooft physics gate.
# Slow ED sweeps (-m slow) are excluded; run `make test-all` locally for those.
name: tests

on:
  push:
  pull_request:

env:
  # several tolerances are set at the double-precision floor; pin the BLAS
  # thread count so the floor is the same on every runner
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [thooft-target, syk-self-averaging, duality, scripts]
        # 3.9 is the certified reference-table platform; 3.12 guards the top
        # of the advertised requires-python range (pyproject: >=3.9,<3.13)
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        working-directory: ${{ matrix.module }}
        run: python -m pytest -q -m 'not slow'

  physics-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: FLZ tables / sum rules / cross-check gate
        working-directory: thooft-target
        run: python validate.py
