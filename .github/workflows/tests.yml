# Fast test suites of all three modules + the thooft physics gate.
# Slow ED sweeps (-m slow) are excluded; run `make test-all` locally for those.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [thooft-target, syk-self-averaging, duality]
        # 3.9 is the certified reference-table platform; 3.12 guards the top
        # of the advertised requires-python range (pyproject: >=3.9,<3.13)
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        working-directory: ${{ matrix.module }}
        run: python -m pytest -q -m 'not slow'

  physics-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: FLZ tables / sum rules / cross-check gate
        working-directory: thooft-target
        run: python validate.py
