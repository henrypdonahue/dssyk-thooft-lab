# Repo-level metadata + pinned dependency set.  `pip install -e .` installs the
# pinned scientific stack.  The modules themselves remain flat script
# directories.  Run scripts and pytest from inside each module directory, as the
# READMEs say.  Cross-module access is by design file-based (duality/ reads
# thooft-target/reference_spectrum.json) or via an explicit sys.path line
# (exact_pair_moments.py importing the chord assembly from duality/).  No
# package installation is required.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hologram-duality"
version = "0.1.0"
description = "Numerical stress-tests of the DSSYK_infinity <-> 't Hooft duality (arXiv:2607.05678)"
# <3.13: numpy 2.0.x / scipy 1.13.x ship wheels only through cp312
requires-python = ">=3.9,<3.13"
dependencies = [
    "numpy==2.0.2",
    "scipy==1.13.1",
    "mpmath==1.3.0",
    # duality/jt_ds_vacuum.py re-derives its [D]-labelled identities in
    # exact sympy at import time (and its test re-runs them), so sympy is
    # a runtime dependency, not a dev extra
    "sympy==1.14.0",
]

[project.optional-dependencies]
# pytest 6.2.5 (the original pin) breaks on python 3.12: its assertion
# rewriter uses ast.Str/ast.Num, removed in 3.12.  7.4.4 is the newest pin
# that still supports 3.9; all 642 fast tests verified green under it
# (python 3.9, the pins below, two BLAS threads; 2026-10-04).
dev = ["pytest==7.4.4", "matplotlib==3.9.4"]

[tool.setuptools]
py-modules = []
